[pytest]
minversion = 7.4
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --cov=src --cov-report=term-missing --cov-config=.coveragerc
markers =
    unit: Unit tests
    integration: Integration tests
    gui: GUI tests requiring pytest-qt
